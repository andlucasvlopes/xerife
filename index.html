<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XERIFE 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1421;color:#edf2f7;font:16px system-ui}header{padding:22px;background:#142538;border-bottom:1px solid #35465a}header b{font-size:26px;color:#e4be65;letter-spacing:3px}small,.muted{color:#b4c3d5}main{max-width:1150px;margin:auto;display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px}nav{display:flex;flex-direction:column;gap:8px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px;background:#e4be65;color:#101b29;font-weight:600}nav button{background:#19283a;color:#edf2f7;text-align:left}nav button.active{background:#e4be65;color:#101b29}section{min-width:0}article,.tile{background:#19283a;border:1px solid #34465a;border-radius:12px;padding:18px;margin-bottom:12px}h1,h2,h3,strong,a{color:#e4be65}h1{margin-top:0}h3{margin-top:0}input,select,textarea{background:#101b29;color:white;border:1px solid #64748b;border-radius:6px;padding:9px;max-width:100%}input[type=number]{width:100px}input[type=checkbox]{accent-color:#e4be65}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile strong{font-size:28px;display:block}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #34465a}progress{width:100%;accent-color:#e4be65}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid white}footer{padding:20px;text-align:center}textarea{width:100%}@media(max-width:700px){main{display:block;padding:12px}nav{flex-direction:row;overflow:auto;margin-bottom:20px}nav button{white-space:nowrap}header{padding:16px}}</style><header><b>🛡 XERIFE 2.0</b><br><small>Operação Aprovação • Guarda Municipal de Marabá • FADESP</small></header><main><nav id="nav"></nav><section id="view"></section></main><footer><small id="notice">Dados locais • Motor de regras • Sem API paga</small></footer><script>
'use strict';const names=['Português','Matemática','Informática','Legislação'],tabs=['Início','Legislação','Missões','Simulados','Desempenho','Agente IA','Configurações'];const $=id=>document.getElementById(id);const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={scores:[null,null,null,null],time:120,missions:{},laws:{},results:[],goal:95,exam:'2027-01-24',errors:[]};try{let old=JSON.parse(localStorage.getItem('xerife-v2')||localStorage.getItem('xerife-v1')||'null');if(old)Object.assign(state,old)}catch(e){}function save(){try{localStorage.setItem('xerife-v2',JSON.stringify(state))}catch(e){$('notice').textContent='Falha ao salvar dados locais.'}}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='Início';const P='https://www.planalto.gov.br/ccivil_03/';const laws=[['CF','Constituição Federal',P+'constituicao/constituicao.htm'],['CP','Código Penal',P+'decreto-lei/del2848compilado.htm'],['CPP','Código de Processo Penal',P+'decreto-lei/del3689compilado.htm'],['13.022/2014','Estatuto Geral das Guardas Municipais',P+'_ato2011-2014/2014/lei/l13022.htm'],['11.343/2006','Lei de Drogas',P+'_ato2004-2006/2006/lei/l11343.htm'],['7.716/1989','Crimes de preconceito',P+'leis/l7716.htm'],['8.069/1990','ECA',P+'leis/l8069.htm'],['10.826/2003','Estatuto do Desarmamento',P+'leis/2003/l10.826.htm'],['11.615/2023','Decreto do Desarmamento',P+'_ato2023-2026/2023/decreto/d11615.htm'],['11.340/2006','Maria da Penha',P+'_ato2004-2006/2006/lei/l11340.htm'],['13.869/2019','Abuso de Autoridade',P+'_ato2019-2022/2019/lei/l13869.htm'],['13.675/2018','SUSP',P+'_ato2015-2018/2018/lei/l13675.htm'],...['17.361/2009','17.384/2009','17.431/2010','17.811/2017','18.163/2022','18.165/2022','Decreto 776/2010','Decreto 626/2026'].map(n=>[n,'Legislação municipal','https://portalfadesp.org.br/?page_id=28663'])];function generate(){let w=state.scores.map(x=>x===null?40:Math.max(10,100-x)),sum=w.reduce((a,b)=>a+b,0),m=w.map(x=>Math.floor(state.time*x/sum));for(let i=0,remaining=state.time-m.reduce((a,b)=>a+b,0);i<remaining;i++) {m[i%4]++;}let old=state.missions[day()]||[];state.missions[day()]=names.map((name,i)=>({name,min:m[i],weight:w[i],done:old.some(t=>t.name===name&&t.min===m[i]&&t.done)})).sort((a,b)=>b.weight-a.weight);save()}function tasks(){if(!state.missions[day()])generate();return state.missions[day()]}function pct(){let t=tasks();return Math.round(100*t.filter(x=>x.done).reduce((a,x)=>a+x.min,0)/state.time)}function days(){return Math.max(0,Math.round((Date.parse(state.exam)-Date.parse(day()))/86400000))}function go(t){tab=t;render()}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go(tabs[${i}])">${t}</button>`).join('');let v=$('view');let t=tasks(),last=state.results.at(-1);let bars=names.map((n,i)=>`<div class="line">${n}<strong>${state.scores[i]===null?'Sem dados':state.scores[i]+'%'}</strong></div><progress max="100" value="${state.scores[i]??0}"></progress>`).join('');if(tab==='Início')v.innerHTML=`<h1>Painel geral</h1><div class="grid">${[['Dias restantes',days()],['Meta de acertos',state.goal+'%'],['Último simulado',last?Math.round(last.correct/last.total*100)+'%':'—'],['Missão diária',pct()+'%']].map(([n,x])=>`<div class="tile"><small>${n}</small><strong>${x}</strong></div>`).join('')}</div><article><h3>Desempenho por disciplina</h3>${bars}</article><article><h3>Diagnóstico do Xerife</h3>Prioridade: ${t[0].name}. <p>${t.filter(x=>!x.done).length} atividades pendentes hoje.</p><button onclick="go('Missões')">Abrir missão</button></article>`;if(tab==='Legislação'){v.innerHTML='<h1>Biblioteca jurídica</h1><p class="muted">Lista preliminar: conferir edital e retificações. Links municipais apontam para a página do concurso; artigos ainda não conferidos.</p><input id="search" placeholder="Pesquisar lei ou número" oninput="lawList()"><p id="lawprogress"></p><div id="lawlist"></div>';lawList()}if(tab==='Missões')v.innerHTML=`<h1>Missão diária</h1><article><small>${day()}</small>${t.map((x,i)=>`<label class="line"><span><input type="checkbox" ${x.done?'checked':''} onchange="tasks()[${i}].done=this.checked;save();render()"> ${x.name}</span><strong>${x.min} min</strong></label>`).join('')}<progress max="100" value="${pct()}"></progress><p>${pct()}% concluído</p></article><article><h3>Histórico</h3>${Object.entries(state.missions).sort().reverse().map(([d,a])=>`<div class="line">${esc(d)} <span>${a.filter(x=>x.done).length}/${a.length} tarefas</span></div>`).join('')}</article>`;if(tab==='Simulados')v.innerHTML=`<h1>Simulados</h1><article><h3>Registrar resultado de prova</h3><form onsubmit="record(event)"><label>Disciplina <select id="subject"><option>Geral</option>${names.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Total de questões <input id="total" type="number" min="1" max="1000" required></label><label>Acertos <input id="correct" type="number" min="0" required></label><button>Salvar resultado</button></form><p class="muted">Registro manual de provas externas; banco de questões ainda não integrado.</p></article>`;if(tab==='Desempenho')v.innerHTML=`<h1>Desempenho</h1><article>${bars}</article><article><h3>Resultados registrados</h3>${state.results.slice().reverse().map(r=>`<div class="line">${esc(r.date)} • ${esc(r.subject)} <strong>${r.correct}/${r.total} (${Math.round(r.correct/r.total*100)}%)</strong></div>`).join('')||'Nenhum resultado registrado.'}</article><article><h3>Caderno de erros</h3><form onsubmit="addError(event)"><textarea id="err" required placeholder="Assunto, erro e correção"></textarea><button>Registrar erro</button></form>${state.errors.map((e,i)=>`<div class="line"><span>${esc(e.text)}<br><small>${esc(e.date)}</small></span><button onclick="state.errors.splice(${i},1);save();render()">Excluir</button></div>`).join('')}</article>`;if(tab==='Agente IA')v.innerHTML=`<h1>Agente Xerife</h1><article><h3>Diagnóstico por regras</h3><p>Prioridade: ${t[0].name}. ${t.filter(x=>!x.done).length} tarefas pendentes.</p><p>${state.scores.some(x=>x===null)?'Registre resultados para melhorar o diagnóstico.':'Reforce disciplinas abaixo da meta de '+state.goal+'%.'}</p><button onclick="generate();render()">Recalcular missão</button><p class="muted">Autonomia local enquanto o site está aberto. IA generativa, chat e notificações em segundo plano ainda não integrados.</p></article>`;if(tab==='Configurações')v.innerHTML=`<h1>Configurações</h1><article><form onsubmit="settings(event)"><label>Data da prova <input id="exam" type="date" required value="${esc(state.exam)}"></label><label>Tempo diário (min) <input id="time" type="number" min="20" max="600" required value="${state.time}"></label><label>Meta (%) <input id="goal" type="number" min="1" max="100" required value="${state.goal}"></label>${names.map((n,i)=>`<label>${n} (% de acertos) <input id="s${i}" type="number" min="0" max="100" value="${state.scores[i]??''}"></label>`).join('')}<button>Salvar configurações</button></form></article>`}function lawList(){let q=$('search').value.toLowerCase();$('lawprogress').textContent=Object.values(state.laws).filter(x=>x.read).length+' de '+laws.length+' leituras concluídas';$('lawlist').innerHTML=laws.map((l,i)=>({l,i})).filter(({l})=>l.join(' ').toLowerCase().includes(q)).map(({l,i})=>`<article><h3>${l[0]} — ${l[1]}</h3><a href="${l[2]}" target="_blank" rel="noopener noreferrer">${i>=12?'Consultar página da FADESP':'Ler legislação oficial'} ↗</a><label><input type="checkbox" ${state.laws[l[0]]?.read?'checked':''} onchange="markLaw(${i},this.checked)"> Leitura concluída</label><small>Última revisão: ${esc(state.laws[l[0]]?.date||'Não registrada')}</small> <button onclick="reviewLaw(${i})">Registrar revisão</button></article>`).join('')}function markLaw(i,b){let k=laws[i][0];state.laws[k]={...state.laws[k],read:b};save();lawList()}function reviewLaw(i){let k=laws[i][0];state.laws[k]={...state.laws[k],date:day()};save();lawList()}function record(e){e.preventDefault();let total=+$('total').value,correct=+$('correct').value,subject=$('subject').value;if(correct>total){alert('Acertos não podem superar o total.');return}state.results.push({date:day(),subject,total,correct});let i=names.indexOf(subject);if(i>=0)state.scores[i]=Math.round(correct/total*100);generate();go('Desempenho')}function addError(e){e.preventDefault();let text=$('err').value.trim();if(text)state.errors.push({text,date:day()});save();render()}function settings(e){e.preventDefault();state.exam=$('exam').value;state.time=+$('time').value;state.goal=+$('goal').value;state.scores=names.map((_,i)=>$('s'+i).value===''?null:+$('s'+i).value);generate();go('Início')}render();let current=day();setInterval(()=>{if(current!==day()){current=day();render()}},60000);
</script></html>
