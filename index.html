<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1421"><title>XERIFE 2.3</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1421;color:#edf2f7;font:16px system-ui}header{padding:22px;background:#142538;border-bottom:1px solid #35465a}header b{font-size:26px;color:#e4be65;letter-spacing:3px}small,.muted{color:#b4c3d5}main{max-width:1150px;margin:auto;display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px}nav{display:flex;flex-direction:column;gap:8px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px;background:#e4be65;color:#101b29;font-weight:600}nav button{background:#19283a;color:#edf2f7;text-align:left}nav button.active{background:#e4be65;color:#101b29}section{min-width:0}article,.tile{background:#19283a;border:1px solid #34465a;border-radius:12px;padding:18px;margin-bottom:12px}h1,h2,h3,strong,a{color:#e4be65}h1{margin-top:0}h3{margin-top:0}input,select,textarea{background:#101b29;color:white;border:1px solid #64748b;border-radius:6px;padding:9px;max-width:100%}input[type=number]{width:100px}input[type=checkbox]{accent-color:#e4be65}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile strong{font-size:28px;display:block}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #34465a}progress{width:100%;accent-color:#e4be65}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid white}footer{padding:20px;text-align:center}textarea{width:100%}@media(max-width:700px){main{display:block;padding:12px}nav{flex-direction:row;overflow:auto;margin-bottom:20px}nav button{white-space:nowrap}header{padding:16px}}[hidden]{display:none!important}#gate{max-width:420px;margin:40px auto;padding:24px;background:#19283a;border-radius:14px}#gate input{width:100%;box-sizing:border-box}#gate button{margin:4px}#account{padding:12px;text-align:right}</style><header><b>🛡 XERIFE 2.3</b><br><small>Operação Aprovação • Guarda Municipal de Marabá • FADESP</small></header><section id="gate"><h1>🛡 XERIFE 2.3</h1><p>Disciplina • Foco • Missão</p><form onsubmit="event.preventDefault();authAction('login')"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button>Entrar</button><button type="button" onclick="authAction('signup')">Solicitar cadastro</button><button type="button" onclick="authAction('reset')">Recuperar senha</button></form><p id="authmsg" role="status"></p><button onclick="enter()">Verificar aprovação</button><button onclick="logout()">Sair / trocar conta</button></section><div id="account" hidden><span id="who"></span> <button id="adminbtn" onclick="adminPanel()" hidden>Administração</button> <button onclick="logout()">Sair</button></div><main hidden><nav id="nav"></nav><section id="view"></section></main><footer><small id="notice">Dados locais • Motor de regras • Sem API paga</small></footer><script>
'use strict';const names=['Português','Matemática','Informática','Conhecimentos Específicos'],tabs=['Início','Legislação','Missões','Simulados','Banco de Questões','Desempenho','Alarmes','TAF','Agente IA','Configurações'];const $=id=>document.getElementById(id);const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let state={scores:[null,null,null,null],time:120,missions:{},laws:{},results:[],goal:95,exam:'2027-01-24',errors:[],questions:[],exams:[],alarms:[],runs:[],timer:null};const defaultState=JSON.stringify(state);function save(){cloudSave()}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='Início';const P='https://www.planalto.gov.br/ccivil_03/';const laws=[['CF','Constituição Federal',P+'constituicao/constituicao.htm'],['CP','Código Penal',P+'decreto-lei/del2848compilado.htm'],['CPP','Código de Processo Penal',P+'decreto-lei/del3689compilado.htm'],['13.022/2014','Estatuto Geral das Guardas Municipais',P+'_ato2011-2014/2014/lei/l13022.htm'],['11.343/2006','Lei de Drogas',P+'_ato2004-2006/2006/lei/l11343.htm'],['7.716/1989','Crimes de preconceito',P+'leis/l7716.htm'],['8.069/1990','ECA',P+'leis/l8069.htm'],['10.826/2003','Estatuto do Desarmamento',P+'leis/2003/l10.826.htm'],['11.615/2023','Decreto do Desarmamento',P+'_ato2023-2026/2023/decreto/d11615.htm'],['11.340/2006','Maria da Penha',P+'_ato2004-2006/2006/lei/l11340.htm'],['13.869/2019','Abuso de Autoridade',P+'_ato2019-2022/2019/lei/l13869.htm'],['13.675/2018','SUSP',P+'_ato2015-2018/2018/lei/l13675.htm'],...['17.361/2009','17.384/2009','17.431/2010','17.811/2017','18.163/2022','18.165/2022','Decreto 776/2010','Decreto 626/2026'].map(n=>[n,'Legislação municipal','https://portalfadesp.org.br/?page_id=28663'])];function generate(){let w=state.scores.map(x=>x===null?40:Math.max(10,100-x)),sum=w.reduce((a,b)=>a+b,0),m=w.map(x=>Math.floor(state.time*x/sum));for(let i=0,remaining=state.time-m.reduce((a,b)=>a+b,0);i<remaining;i++) {m[i%4]++;}let old=state.missions[day()]||[];state.missions[day()]=names.map((name,i)=>({name,min:m[i],weight:w[i],done:old.some(t=>t.name===name&&t.min===m[i]&&t.done)})).sort((a,b)=>b.weight-a.weight);save()}function tasks(){if(!state.missions[day()])generate();return state.missions[day()]}function pct(){let t=tasks();return Math.round(100*t.filter(x=>x.done).reduce((a,x)=>a+x.min,0)/state.time)}function days(){return Math.max(0,Math.round((Date.parse(state.exam)-Date.parse(day()))/86400000))}function go(t){tab=t;render()}function render(){ $('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go(tabs[${i}])">${t}</button>`).join('');let v=$('view');let t=tasks(),last=state.results.at(-1);let bars=names.map((n,i)=>`<div class="line">${n}<strong>${state.scores[i]===null?'Sem dados':state.scores[i]+'%'}</strong></div><progress max="100" value="${state.scores[i]??0}"></progress>`).join('');if(tab==='Início')v.innerHTML=`<h1>Painel geral</h1><div class="grid">${[['Dias restantes',days()],['Meta de acertos',state.goal+'%'],['Último simulado',last?Math.round(last.correct/last.total*100)+'%':'—'],['Missão diária',pct()+'%']].map(([n,x])=>`<div class="tile"><small>${n}</small><strong>${x}</strong></div>`).join('')}</div><article><h3>Desempenho por disciplina</h3>${pies()}</article><article><h3>Diagnóstico do Xerife</h3>Prioridade: ${t[0].name}. <p>${t.filter(x=>!x.done).length} atividades pendentes hoje.</p><button onclick="go('Missões')">Abrir missão</button></article>`;if(tab==='Legislação'){v.innerHTML='<h1>Biblioteca jurídica</h1><p class="muted">Lista preliminar: conferir edital e retificações. Links municipais apontam para a página do concurso; artigos ainda não conferidos.</p><input id="search" placeholder="Pesquisar lei ou número" oninput="lawList()"><p id="lawprogress"></p><div id="lawlist"></div>';lawList()}if(tab==='Missões')v.innerHTML=`<h1>Missão diária</h1><article><small>${day()}</small>${t.map((x,i)=>`<label class="line"><span><input type="checkbox" ${x.done?'checked':''} onchange="tasks()[${i}].done=this.checked;save();render()"> ${x.name}</span><strong>${x.min} min</strong></label>`).join('')}<progress max="100" value="${pct()}"></progress><p>${pct()}% concluído</p></article><article><h3>Histórico</h3>${Object.entries(state.missions).sort().reverse().map(([d,a])=>`<div class="line">${esc(d)} <span>${a.filter(x=>x.done).length}/${a.length} tarefas</span></div>`).join('')}</article>`;if(tab==='Simulados')v.innerHTML=`<h1>Simulados</h1><article><h3>Registrar resultado de prova</h3><form onsubmit="record(event)"><label>Disciplina <select id="subject"><option>Geral</option>${names.map(n=>`<option>${n}</option>`).join('')}</select></label><label>Total de questões <input id="total" type="number" min="1" max="1000" required></label><label>Acertos <input id="correct" type="number" min="0" required></label><button>Salvar resultado</button></form><p class="muted">Registro manual de provas externas; use o gerador abaixo para questões cadastradas.</p></article>`;if(tab==='Desempenho')v.innerHTML=`<h1>Desempenho</h1><article>${bars}</article><article><h3>Resultados registrados</h3>${state.results.slice().reverse().map(r=>`<div class="line">${esc(r.date)} • ${esc(r.subject)} <strong>${r.correct}/${r.total} (${Math.round(r.correct/r.total*100)}%)</strong></div>`).join('')||'Nenhum resultado registrado.'}</article><article><h3>Caderno de erros</h3><form onsubmit="addError(event)"><textarea id="err" required placeholder="Assunto, erro e correção"></textarea><button>Registrar erro</button></form>${state.errors.map((e,i)=>`<div class="line"><span>${esc(e.text)}<br><small>${esc(e.date)}</small></span><button onclick="state.errors.splice(${i},1);save();render()">Excluir</button></div>`).join('')}</article>`;if(tab==='Agente IA')v.innerHTML=`<h1>Agente Xerife</h1><article><h3>Diagnóstico por regras</h3><p>Prioridade: ${t[0].name}. ${t.filter(x=>!x.done).length} tarefas pendentes.</p><p>${state.scores.some(x=>x===null)?'Registre resultados para melhorar o diagnóstico.':'Reforce disciplinas abaixo da meta de '+state.goal+'%.'}</p><button onclick="generate();render()">Recalcular missão</button><p class="muted">Autonomia local enquanto o site está aberto. IA generativa, chat e notificações em segundo plano ainda não integrados.</p></article>`;if(tab==='Configurações')v.innerHTML=`<h1>Configurações</h1><article><form onsubmit="settings(event)"><label>Data da prova <input id="exam" type="date" required value="${esc(state.exam)}"></label><label>Tempo diário (min) <input id="time" type="number" min="20" max="600" required value="${state.time}"></label><label>Meta (%) <input id="goal" type="number" min="1" max="100" required value="${state.goal}"></label>${names.map((n,i)=>`<label>${n} (% de acertos) <input id="s${i}" type="number" min="0" max="100" value="${state.scores[i]??''}"></label>`).join('')}<button>Salvar configurações</button></form></article>`;if(tab==='Banco de Questões')bank();if(tab==='Simulados')sim();if(tab==='Alarmes')alarms();if(tab==='TAF')taf();if(tab==='Configurações')v.innerHTML+=`<article><button onclick="backup()">Exportar backup JSON</button></article>`}function lawList(){let q=$('search').value.toLowerCase();$('lawprogress').textContent=Object.values(state.laws).filter(x=>x.read).length+' de '+laws.length+' leituras concluídas';$('lawlist').innerHTML=laws.map((l,i)=>({l,i})).filter(({l})=>l.join(' ').toLowerCase().includes(q)).map(({l,i})=>`<article><h3>${l[0]} — ${l[1]}</h3><a href="${l[2]}" target="_blank" rel="noopener noreferrer">${i>=12?'Consultar página da FADESP':'Ler legislação oficial'} ↗</a><label><input type="checkbox" ${state.laws[l[0]]?.read?'checked':''} onchange="markLaw(${i},this.checked)"> Leitura concluída</label><small>Última revisão: ${esc(state.laws[l[0]]?.date||'Não registrada')}</small> <button onclick="reviewLaw(${i})">Registrar revisão</button></article>`).join('')}function markLaw(i,b){let k=laws[i][0];state.laws[k]={...state.laws[k],read:b};save();lawList()}function reviewLaw(i){let k=laws[i][0];state.laws[k]={...state.laws[k],date:day()};save();lawList()}function record(e){e.preventDefault();let total=+$('total').value,correct=+$('correct').value,subject=$('subject').value;if(correct>total){alert('Acertos não podem superar o total.');return}state.results.push({date:day(),subject,total,correct});let i=names.indexOf(subject);if(i>=0)state.scores[i]=Math.round(correct/total*100);generate();go('Desempenho')}function addError(e){e.preventDefault();let text=$('err').value.trim();if(text)state.errors.push({text,date:day()});save();render()}function settings(e){e.preventDefault();state.exam=$('exam').value;state.time=+$('time').value;state.goal=+$('goal').value;state.scores=names.map((_,i)=>$('s'+i).value===''?null:+$('s'+i).value);generate();go('Início')}
const opts=()=>names.map(n=>`<option>${n}</option>`).join('');
function pies(){let a=state.results.reduce((a,r)=>[a[0]+r.correct,a[1]+r.total],[0,0]);return '<div class="grid">'+[...names,'Geral (registros)'].map((n,i)=>{let x=i<4?state.scores[i]:a[1]?Math.round(a[0]/a[1]*100):null;return `<div class="tile" style="text-align:center">${n}<div style="margin:12px auto;width:110px;height:110px;border-radius:50%;background:${x===null?'#526174':`conic-gradient(#39b982 ${x}%,#b94c4c 0)`};display:grid;place-items:center"><strong style="background:#19283a;border-radius:50%;width:75px;height:75px;display:grid;place-items:center;font-size:20px">${x===null?'—':x+'%'}</strong></div><small>${x===null?'Sem dados':'Verde: acertos • vermelho: erros'}</small></div>`}).join('')+'</div>'}
function bank(){ $('view').innerHTML=`<h1>Banco de Questões</h1><article><form onsubmit="addQ(event)"><label>Disciplina <select id="qd">${opts()}</select></label><label>Assunto <input id="qa" required></label><label>Banca <input id="qb" value="FADESP"></label><label>Ano / concurso <input id="qy"></label><label>Enunciado <textarea id="qt" required></textarea></label>${'ABCDE'.split('').map((a,i)=>`<label>${a} <input id="q${i}" ${i<2?'required':''}></label>`).join('')}<label>Gabarito <select id="qg">${'ABCDE'.split('').map((a,i)=>`<option value="${i}">${a}</option>`).join('')}</select></label><label>Comentário <textarea id="qc"></textarea></label><button>Salvar questão</button></form></article><article><h3>${state.questions.length} questões</h3><input id="qsearch" placeholder="Pesquisar" oninput="listQ()"><div id="qlist"></div></article>`;listQ()}
function listQ(){let q=$('qsearch').value.toLowerCase();$('qlist').innerHTML=state.questions.map((x,i)=>({x,i})).filter(({x})=>JSON.stringify(x).toLowerCase().includes(q)).map(({x,i})=>`<div class="line"><span>${esc(x.d)} • ${esc(x.a)}<br>${esc(x.t)}</span><button onclick="if(confirm('Excluir questão?')){state.questions.splice(${i},1);save();bank()}">Excluir</button></div>`).join('')}
function addQ(e){e.preventDefault();let o=Array.from({length:5},(_,i)=>$('q'+i).value.trim()),g=+$('qg').value;if(!o[g])return alert('Preencha a alternativa correta.');state.questions.push({d:$('qd').value,a:$('qa').value,b:$('qb').value,y:$('qy').value,t:$('qt').value,o,g,c:$('qc').value});save();bank()}
function sim(){ $('view').innerHTML+=`<article><h3>Gerar simulado</h3><form onsubmit="makeExam(event)"><select id="ed"><option>Geral</option>${opts()}</select> <input id="en" type="number" min="1" value="10" required> <button>Gerar</button></form></article><article><h3>Simulados salvos</h3>${state.exams.map((x,i)=>`<div class="line">${esc(x.date)} • ${x.q.length} questões <button onclick="openExam(${i})">Abrir</button><button onclick="printExam(${i},false)">PDF prova</button><button onclick="printExam(${i},true)">PDF gabarito</button></div>`).join('')}</article><div id="examview"></div><button onclick="printReport()">PDF resultados</button>`}
function makeExam(e){e.preventDefault();let d=$('ed').value,n=+$('en').value,q=state.questions.filter(x=>d==='Geral'||x.d===d).slice();if(q.length<n)return alert('Questões disponíveis: '+q.length);for(let i=q.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}state.exams.push({date:day(),d,q:q.slice(0,n)});save();render();openExam(state.exams.length-1)}
function openExam(i){let x=state.exams[i];$('examview').innerHTML=`<article><form onsubmit="grade(event,${i})">${x.q.map((q,j)=>`<fieldset><legend>${j+1}. ${esc(q.t)}</legend>${q.o.map((o,k)=>o?`<label><input type="radio" name="ans${j}" value="${k}" required> ${'ABCDE'[k]}) ${esc(o)}</label>`:'').join('')}</fieldset>`).join('')}<button>Corrigir</button></form></article>`}
function grade(e,i){e.preventDefault();let x=state.exams[i],f=new FormData(e.target),c=0;let by={};x.q.forEach((q,j)=>{let ok=+f.get('ans'+j)===q.g;c+=ok;let b=by[q.d]??=[0,0];b[0]+=ok;b[1]++;if(!ok)state.errors.push({date:day(),text:q.t+' | Correta: '+ 'ABCDE'[q.g]+' | '+q.c})});for(let [d,b] of Object.entries(by)){state.results.push({date:day(),subject:d,correct:b[0],total:b[1]});state.scores[names.indexOf(d)]=Math.round(b[0]/b[1]*100)}generate();alert(c+'/'+x.q.length+' acertos');go('Desempenho')}
function printDoc(title,body){let w=window.open('','_blank');if(!w)return alert('Permita pop-ups.');w.document.write(`<html lang="pt-BR"><meta charset="utf-8"><title>${title}</title><style>body{font:15px Arial;margin:35px}article{break-inside:avoid}p{white-space:pre-wrap}[hidden]{display:none!important}#gate{max-width:420px;margin:40px auto;padding:24px;background:#19283a;border-radius:14px}#gate input{width:100%;box-sizing:border-box}#gate button{margin:4px}#account{padding:12px;text-align:right}</style><h1>${title}</h1>${body}</html>`);w.document.close();w.focus();w.print()}
function printExam(i,key){let x=state.exams[i];printDoc(key?'XERIFE — Gabarito':'XERIFE — Simulado',x.q.map((q,j)=>`<article><p>${j+1}. ${key?'ABCDE'[q.g]:esc(q.t)}</p>${key?esc(q.c):q.o.map((o,k)=>o?`<p>${'ABCDE'[k]}) ${esc(o)}</p>`:'').join('')}</article>`).join(''))}
function printReport(){printDoc('XERIFE — Resultados',state.results.map(r=>`<p>${esc(r.date)} — ${esc(r.subject)}: ${r.correct}/${r.total}</p>`).join(''))}
function alarms(){ $('view').innerHTML=`<h1>Alarmes</h1><article><form onsubmit="addAlarm(event)"><label>Horário <input type="time" id="at" required></label><label>Lembrete <input id="an" required></label><button>Adicionar alarme diário</button></form><button onclick="enableNotify()">Autorizar notificações e som</button><p class="muted">Alarmes locais: exigem página aberta; segundo plano pode atrasar.</p></article>${state.alarms.map((a,i)=>`<article><label><input type="checkbox" ${a.on?'checked':''} onchange="state.alarms[${i}].on=this.checked;save()"> ${esc(a.t)} — ${esc(a.n)}</label><button onclick="state.alarms.splice(${i},1);save();alarms()">Excluir</button></article>`).join('')}`}
function addAlarm(e){e.preventDefault();state.alarms.push({t:$('at').value,n:$('an').value,on:true,last:''});save();alarms()}
let audio;async function enableNotify(){try{audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();if('Notification'in window)await Notification.requestPermission()}catch(e){alert('Permissão indisponível.')}}
function checkAlarm(){let d=new Date(),t=d.toTimeString().slice(0,5);for(let a of state.alarms){if(a.on&&a.t===t&&a.last!==day()){a.last=day();save();if(audio){try{let o=audio.createOscillator();o.connect(audio.destination);o.start();o.stop(audio.currentTime+.7)}catch(e){}}if('Notification'in window&&Notification.permission==='granted'){navigator.serviceWorker?.ready.then(r=>r.showNotification('XERIFE',{body:a.n})).catch(()=>{})}else alert(a.n)}}}
let watch=null,lastPos=null;function elapsed(){let t=state.timer;return t?Math.max(0,t.ms+(t.start?Date.now()-t.start:0)):0}function clock(ms){return new Date(ms).toISOString().slice(11,19)}
function taf(){let t=state.timer;$('view').innerHTML=`<h1>TAF — Corrida e caminhada</h1><article><label>Atividade <select id="rt" ${t?'disabled':''}><option ${t?.type==='Corrida'?'selected':''}>Corrida</option><option ${t?.type==='Caminhada'?'selected':''}>Caminhada</option></select></label><h2 id="clock">${clock(elapsed())}</h2><button onclick="startRun()">${t?'Continuar':'Iniciar'}</button> <button onclick="pauseRun()">Pausar</button> <button onclick="finishRun()">Finalizar e salvar</button><label>Distância (km) <input id="rk" type="number" min="0" step="0.001" value="${t?.km||0}" oninput="if(state.timer){state.timer.km=+this.value;save()}"></label><button onclick="gps()">Ativar GPS</button><p id="gpsmsg" class="muted">GPS depende da permissão e página ativa.</p><p id="metrics"></p></article><article><h3>Histórico • ${state.runs.reduce((a,r)=>a+r.km,0).toFixed(2)} km</h3>${state.runs.map(r=>`<div class="line">${esc(r.date)} • ${esc(r.type)} • ${r.km.toFixed(2)} km • ${clock(r.ms)}</div>`).join('')}</article>`;tick()}
function startRun(){if(!state.timer)state.timer={type:$('rt').value,ms:0,start:Date.now(),km:+$('rk').value||0};else if(!state.timer.start)state.timer.start=Date.now();save();taf()}
function stopGPS(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;lastPos=null}
function pauseRun(){if(!state.timer)return;state.timer.ms=elapsed();state.timer.start=null;stopGPS();save();taf()}
function finishRun(){if(!state.timer)return alert('Inicie uma atividade.');let km=+$('rk').value;if(!Number.isFinite(km)||km<0)return alert('Distância inválida.');state.runs.push({date:day(),type:state.timer.type,ms:elapsed(),km});state.timer=null;stopGPS();save();taf()}
function gps(){if(!state.timer?.start)return alert('Inicie o cronômetro.');if(!navigator.geolocation)return alert('GPS indisponível.');stopGPS();watch=navigator.geolocation.watchPosition(p=>{if(!state.timer?.start||p.coords.accuracy>50)return;let c=p.coords;if(lastPos){let rad=Math.PI/180, a=Math.sin((c.latitude-lastPos.latitude)*rad/2)**2+Math.cos(c.latitude*rad)*Math.cos(lastPos.latitude*rad)*Math.sin((c.longitude-lastPos.longitude)*rad/2)**2;let dist=6371*2*Math.asin(Math.min(1,Math.sqrt(a)));if(dist>.005&&dist<.3){state.timer.km+=dist;save();if($('rk'))$('rk').value=state.timer.km.toFixed(3)}}lastPos=c;if($('gpsmsg'))$('gpsmsg').textContent='GPS ativo • precisão '+Math.round(c.accuracy)+' m'},e=>{if($('gpsmsg'))$('gpsmsg').textContent=e.message},{enableHighAccuracy:true,maximumAge:0})}
function tick(){if(!$('clock'))return;let ms=elapsed(),km=+$('rk').value||0;$('clock').textContent=clock(ms);$('metrics').textContent=ms>0&&km>0?`Velocidade: ${(km*3600000/ms).toFixed(2)} km/h • Pace: ${Math.floor(ms/60000/km)}:${String(Math.floor(ms/1000/km)%60).padStart(2,'0')} min/km`:'Sem métricas ainda'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='xerife-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);setInterval(tick,500);setInterval(()=>{if(uid)checkAlarm()},1000);
let current=day();setInterval(()=>{if(uid&&current!==day()){current=day();render()}},60000);
